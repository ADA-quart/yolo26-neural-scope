<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070f" />
    <script>
      (() => {
        try {
          const daylight = localStorage.getItem("yolo26-theme") === "daylight";
          document.documentElement.dataset.theme = daylight ? "daylight" : "night";
          if (daylight) {
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#eef1f5");
          }
        } catch {
          document.documentElement.dataset.theme = "night";
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23050912' stroke='%235ee7ff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%237f9dff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%235ee7ff'/%3E%3C/svg%3E"
    />
    <title>YOLO26 · 神经显微镜</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
